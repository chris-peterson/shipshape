# Canonical descriptor for the shipshape plugin — edit here, never plugin.json.
# Projects into .claude-plugin/plugin.json (via `scripts/shipyard gen-plugin-json`) and
# the marketplace SPA (the suite: block).

name: shipshape
version: 0.5.0
description: Know what's changing in your Claude Code harness and keep it current — every Claude Code upgrade handled, every plugin reconciled, updated, and pruned.
author: chris-peterson
repository: https://github.com/chris-peterson/shipshape
keywords: [plugins, maintenance, auto-update, marketplace, claude-code, upgrades, harness]
license: MIT

# → marketplace.json entry
marketplace:
  category: development
  homepage: https://chris-peterson.github.io/shipshape/#/

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  group: safety
  # Activated by the user (/plugin-maintenance, /claude-code-version) and by
  # SessionStart hooks that arm marketplace auto-update and announce a Claude
  # Code version change.
  activations: [user, session]
  gloss: Everything stowed, secured, and ready for sea.
  pitch: "Tells you what changed in your coding harness and keeps it current: Claude Code itself, and the plugins you've installed. Out-of-date tooling is its own kind of risk."
  what: "Two jobs for the harness you work inside: telling you what changed, and keeping current what it can. Claude Code itself updates between launches, so the next session opens with a banner naming both versions and linking that release's changelog, and /claude-code-version walks you through what changed, runs the re-training instructions you wrote for an upgrade, and clears the banner. Your plugins it maintains directly: reconciling what's installed against the set you've declared, updating them, and reaping the stale version caches an update leaves behind and the data dirs an uninstall would have deleted unasked, without touching a version a live session still holds — plus a load-time hook that arms marketplace auto-update so they keep themselves current."
  cmds:
    - ["/claude-code-version", "Handle a Claude Code upgrade: what's new, your instructions, acknowledge"]
    - ["/plugin-maintenance", "Reconcile, update, and prune your installed plugins"]
  # Skill-anchored previews shown live on the docs site; the session: below is
  # the at-a-glance flow the hub also reads.
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      claude-code-version: Handle a Claude Code version change — what's new, the instructions to run on an upgrade, and acknowledging it, which clears shipshape's banner.
      plugin-maintenance: Reconcile installed Claude Code plugins against your desired set (enabledPlugins in settings.json) — update what stays, install/uninstall to match, and prune stale caches and orphan data dirs.
    hooks:
      claude-code-version: SessionStart — Announce a Claude Code version change, and hand it to /claude-code-version.
      enforce-autoupdate: SessionStart — Enforce marketplace auto-update.
      hooks: 'Hook wiring: SessionStart→enforce-autoupdate (*), claude-code-version (*).'
  # <<< shipyard:describe <<<
  examples:
    - label: "/claude-code-version"
      ac: "--guard"
      frames:
        - { t: you, text: "/claude-code-version" }
        - { t: claude, text: "Claude Code moved 2.1.234 → 2.1.235 since you last acknowledged. Want the changelog entry for it, or should I run the instructions in your guide and clear the banner?" }
        - { t: status, text: "reads the changelog delta, runs your guide once, records the version" }
    - label: "/plugin-maintenance"
      ac: "--guard"
      frames:
        - { t: you, text: "/plugin-maintenance" }
        - { t: claude, text: "24 installed, 22 enabled. Nine of the disabled ones aren't in the set you declared — I'll uninstall those, keep their data dirs so you can judge them, and skip the one that's team-shared." }
        - { t: status, text: "gates every uninstall on the install manifest, one update at a time" }
    - label: "/plugin-maintenance"
      ac: "--guard"
      frames:
        - { t: you, text: "/plugin-maintenance" }
        - { t: claude, text: "All 19 enabled plugins accounted for: 15 already current, 4 refreshed from source. Seven stale caches, six pruned (~4.1M); the seventh is pinned by a session that's still running." }
        - { t: status, text: "arms marketplace auto-update so plugins stay current on their own" }
  session:
    - { t: claude, text: "Twelve of your installed plugins are disabled, and nine of those aren't in the set you declared." }
    - { t: cmd, cmd: "/plugin-maintenance", out: "🗑️ 9 uninstalled · ⏭️ 1 skipped (team-shared) · 🧹 11 caches pruned (~2.1M) · 🔒 1 pinned by a live session. Data dirs kept for you to judge. Run /reload-plugins to apply it here." }
    - { t: event, text: "next launch: marketplace auto-update armed for all 4 marketplaces" }
    - { t: event, text: "a week later: Claude Code 2.1.234 → 2.1.235 · banner, every session, until you acknowledge it" }
    - { t: cmd, cmd: "/claude-code-version", out: "Walked that release's changelog entry, then ran the instructions in your guide. Acknowledged 2.1.235 — banner cleared." }
    - { t: note, text: "Plugins keep themselves current, and a Claude Code upgrade stops being something you find out about later." }

docs:
  code_languages: [bash, json]
  mermaid: true
