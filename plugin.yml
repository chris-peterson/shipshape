# Canonical descriptor for the shipshape plugin — edit here, never plugin.json.
# Projects into .claude-plugin/plugin.json (via `shipyard gen-plugin-json`) and
# the marketplace SPA (the suite: block).

name: shipshape
version: 0.10.0
description: Know what's changing in your Claude Code harness and keep it current — every Claude Code upgrade handled, every plugin reconciled, updated, and pruned.
author: chris-peterson
repository: https://github.com/chris-peterson/shipshape
keywords: [plugins, maintenance, auto-update, marketplace, claude-code, upgrades, harness]
license: MIT

validate:
  accept:
    - warning: root
      path: CLAUDE.md
      because: >-
        CLAUDE.md at the root is this repo's own agent instructions, not context
        the plugin ships. It points at AGENTS.md and carries the notes for
        working on shipshape itself.

# → marketplace.json entry
marketplace:
  category: development
  homepage: https://chris-peterson.github.io/shipshape/#/

# → marketplace SPA; keys mirror the SPA's PLUGINS object.
suite:
  group: safety
  # Activated by the user (/plugin-maintenance, /claude-code-version) and by
  # SessionStart hooks that arm marketplace auto-update and announce a Claude
  # Code version change.
  activations: [user, session]
  gloss: Everything stowed, secured, and ready for sea.
  pitch: "Tells you what changed in your coding harness and keeps it current: Claude Code itself, and the plugins you've installed. Out-of-date tooling is its own kind of risk."
  what: "Two jobs for the harness you work inside: telling you what changed, and keeping current what it can. Claude Code itself updates in the background and the new version takes effect at your next launch, so that session opens with a banner naming both versions and linking that release's changelog, and /claude-code-version walks you through what changed, runs the re-training instructions you wrote for an upgrade, and clears the banner. Your plugins it maintains directly: reconciling what's installed against the set you've declared, updating them, and pruning the stale version caches an update leaves behind and the data dirs an uninstall would have deleted unasked, without touching a version a live session still holds — plus a load-time hook that arms marketplace auto-update so they keep themselves current."
  cmds:
    - ["/claude-code-version", "Handle a Claude Code upgrade: what's new, your instructions, acknowledge"]
    - ["/plugin-maintenance", "Reconcile, update, and prune your installed plugins"]
  # >>> shipyard:describe — generated from source by `shipyard gen-describe`; do not edit >>>
  describe:
    skills:
      claude-code-version: Handle a Claude Code version change — what's new, the instructions to run on an upgrade, and acknowledging it, which clears shipshape's banner.
      plugin-maintenance: Reconcile installed Claude Code plugins against your desired set (enabledPlugins in settings.json) — update what stays, install/uninstall to match, and prune stale caches and orphan data dirs.
    hooks:
      claude-code-version: SessionStart — Announce a Claude Code version change, and hand it to /claude-code-version.
      enforce-autoupdate: SessionStart — Enforce marketplace auto-update.
      hooks: 'Hook wiring: SessionStart→enforce-autoupdate (*), claude-code-version (*).'
  # <<< shipyard:describe <<<
  session:
    # One session: each skill runs once. Acknowledging clears the banner, so the
    # version errand is over for good — the three modes it can take are a table
    # on the docs page, not repeated invocations here.
    - { t: event, text: "session start: Claude Code 2.1.234 → 2.1.235 · repeats every session until you acknowledge it" }
    - { t: cmd, cmd: "/claude-code-version", out: "Walked that release's changelog entry: nothing in it touches a hook schema or settings key your own rules depend on. Ran the instructions in your guide, and acknowledged 2.1.235 — banner cleared." }
    - { t: cmd, cmd: "/plugin-maintenance", out: "19 enabled · 15 current, 4 refreshed · 🗑️ 9 undeclared uninstalled, data dirs kept for you to judge · 🧹 6 stale caches pruned (~4.1M), 1 pinned by a live session. Run /reload-plugins to apply it here." }
    - { t: event, text: "next launch: marketplace auto-update armed for all 4 marketplaces" }
    - { t: note, text: "Plugins keep themselves current, and a Claude Code upgrade stops being something you find out about later." }

docs:
  code_languages: [bash, json]
  mermaid: true
