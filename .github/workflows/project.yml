name: Project

# Every generated artifact has one writer, and it is this job. shipyard's
# project action regenerates .claude-plugin/plugin.json, hooks/hooks.json,
# plugin.yml's suite.describe block, and the rendered docs from their sources
# and commits the result to the branch, so a committed artifact matches its
# source at all times and the diff a reviewer approves is the change that lands.
#
# shipshape's sources are YAML and Markdown, so this job is the action alone —
# there is nothing to build ahead of it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # The default pull_request checkout leaves a merge commit in
          # detached HEAD, and there is no branch there to push a projection to.
          ref: ${{ github.head_ref }}

      - uses: chris-peterson/shipyard/actions/project@v2
